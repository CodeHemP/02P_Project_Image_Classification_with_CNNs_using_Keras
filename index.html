<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triangle Area Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>Triangle Area Calculator</h1>
    <p>Enter the base and height to calculate the area.</p>

    <form id="triangle-form" class="calculator" novalidate>
      <label for="base">Base</label>
      <input id="base" name="base" type="number" min="0" step="any" placeholder="e.g. 10" required />

      <label for="height">Height</label>
      <input id="height" name="height" type="number" min="0" step="any" placeholder="e.g. 5" required />

      <button type="submit">Calculate Area</button>
    </form>

    <section class="result" aria-live="polite">
      <h2>Result</h2>
      <p id="message">Fill in both values and click calculate.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
